spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:wallet-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8081}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
app.secret=${APP_SECRET:secret}
# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# JWT
app.jwt.secret=${APP_JWT_SECRET:default-secret-jwt-key-for-development-and-testing-purposes-123456789}
# OAuth
spring.security.oauth2.authorizationserver.client.google.client-id=${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_CLIENT_GOOGLE_CLIENT_ID:dummy-id}
# Liquibase
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:${SPRING_DATA_REDIS_USER:}}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000}
# Minio
minio.url=${MINIO_URL:http://localhost:9000}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESSKEY:minioadmin}
minio.secretKey=${MINIO_SECRETKEY:minioadmin}
minio.bucketName=${MINIO_BUCKETNAME:coffe}
# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# FrontEnd
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowedOrigins=${APP_CORS_ALLOWEDORIGINS:http://localhost:5173}
# Midtrans
midtrans.server-key=${MIDTRANS_SERVER_KEY:dummy-server-key}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:dummy-client-key}
midtrans.is-production=${MIDTRANS_IS_PRODUCTION:false}
midtrans.override-notification=${MIDTRANS_OVERRIDE_NOTIFICATION:}
# OpenTelemetry Tracing
otel.service.name=${OTEL_SERVICE_NAME:wallet-service}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}
otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
otel.metrics.exporter=${OTEL_METRICS_EXPORTER:none}
otel.logs.exporter=${OTEL_LOGS_EXPORTER:none}